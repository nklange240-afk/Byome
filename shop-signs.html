<body>
  <header class="site-header">
    <a href="index.html" class="logo"><img src="logo-wordmark.png" alt="Byome home" width="1052" height="261" /></a>
    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <!-- The menu items are filled in by nav-menu.js, the same on every page -->
    <nav id="nav-menu" class="nav-menu" hidden></nav>
  </header>
  <main class="feed-page sign-stats-page">
    <h1>Shop signs</h1>
    <p class="sign-stats-intro">How often the hanging signs in the Byome Shop are seen and tapped. A view counts when at least half a sign has been on screen for a second. <strong>Viewers</strong> counts each member once a day. Under each number of taps is the share of views that were tapped.</p>
    <div id="sign-stats-periods" class="category-chips" role="group" aria-label="Time period" hidden>
      <button type="button" class="category-chip" data-days="7" aria-pressed="false">7 days</button>
      <button type="button" class="category-chip" data-days="30" aria-pressed="true">30 days</button>
      <button type="button" class="category-chip" data-days="90" aria-pressed="false">90 days</button>
      <button type="button" class="category-chip" data-days="365" aria-pressed="false">A year</button>
    </div>
    <div id="sign-stats" aria-live="polite">
      <p class="feed-empty is-loading">Loading…</p>
    </div>
  </main>
