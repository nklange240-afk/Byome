<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — byome</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">by<span class="logo-accent">🌱</span>me</a>

    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <nav id="nav-menu" class="nav-menu" hidden>
      <a href="feed.html" class="btn btn-ghost">Community</a>
      <a href="reviews.html" class="btn btn-ghost">Reviews</a>
      <a href="profile.html" class="btn btn-ghost">Profile</a>
      <a href="biome-shop.html" class="btn btn-ghost">Biome shop</a>
      <a href="suggest-product.html" class="btn btn-ghost">Suggest a product</a>
      <a href="moderate-products.html" id="moderate-link" class="btn btn-ghost" hidden>Moderate</a>
      <hr />
      <span id="header-username" class="header-username"></span>
      <button id="logout-btn" class="btn btn-ghost" type="button" hidden>Log out</button>
      <a href="login.html" id="login-link" class="btn btn-ghost">Log in</a>
      <a href="signup.html" id="signup-link" class="btn btn-solid">Sign up</a>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-sub">Join byome to write reviews and take part in the community.</p>

      <form id="signup-form" class="stacked-form">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_.\-]+"
          title="Letters, numbers, and _ . or - (no spaces)" />

        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" />

        <button type="submit" class="btn btn-solid">Sign up</button>
      </form>

      <!-- This empty paragraph gets filled in by JavaScript once
           someone submits the form — success or error, it shows here. -->
      <p id="signup-message" class="auth-message"></p>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <!-- Supabase's own code library, loaded from their servers -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Our shared connection setup -->
  <script src="supabase-client.js?v=20"></script>
  <!-- Hamburger menu behavior -->
  <script src="nav-menu.js?v=20"></script>
  <!-- The logic specific to this page -->
  <script src="signup.js?v=20"></script>
</body>
</html>
