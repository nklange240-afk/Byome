<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — byome</title>
  <!-- Tab icon and the preview card shown when a link is shared -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#24402F" />
  <meta name="description" content="Honest beauty reviews from the people actually using the products, plus a community and a little shelf of plants to grow." />
  <meta property="og:site_name" content="byome" />
  <meta property="og:title" content="byome — honest beauty reviews, grown together" />
  <meta property="og:description" content="Honest beauty reviews from the people actually using the products, plus a community and a little shelf of plants to grow." />
  <meta property="og:image" content="https://byome.xyz/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=38" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">by<span class="logo-accent">🌱</span>me</a>

    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <!-- The menu items are filled in by nav-menu.js, the same on every page -->
    <nav id="nav-menu" class="nav-menu" hidden></nav>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-sub">Join byome to write reviews and take part in the community.</p>

      <form id="signup-form" class="stacked-form">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_.\-]+"
          title="Letters, numbers, and _ . or - (no spaces)" autocomplete="username" aria-describedby="username-hint" />
        <p class="field-hint" id="username-hint">3–20 letters or numbers; _ . and - are fine too.</p>

        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" aria-describedby="password-hint" />
        <p class="field-hint" id="password-hint">At least 8 characters.</p>

        <button type="submit" class="btn btn-solid">Sign up</button>
      </form>

      <!-- This empty paragraph gets filled in by JavaScript once
           someone submits the form — success or error, it shows here. -->
      <p id="signup-message" class="auth-message"></p>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <!-- Supabase's own code library, loaded from their servers -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Our shared connection setup -->
  <script src="supabase-client.js?v=38"></script>
  <!-- Hamburger menu behavior -->
  <script src="nav-menu.js?v=38"></script>
  <script src="ui.js?v=38"></script>
  <!-- The logic specific to this page -->
  <script src="signup.js?v=38"></script>
</body>
</html>
