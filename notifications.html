<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — byome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=21" />
</head>
<body>
  <header class="site-header">
    <a href="feed.html" class="logo">by<span class="logo-accent">🌱</span>me</a>
    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <!-- The menu items are filled in by nav-menu.js, the same on every page -->
    <nav id="nav-menu" class="nav-menu" hidden></nav>
  </header>
  <main class="feed-page">
    <h1>Notifications</h1>
    <p><button id="mark-read-btn" class="action-btn" type="button" hidden>Mark all as read</button></p>
    <section id="notification-list" class="feed" aria-live="polite">
      <p class="feed-empty">Loading...</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=21"></script>
  <script src="nav-menu.js?v=21"></script>
  <script src="notifications.js?v=21"></script>
</body>
</html>
