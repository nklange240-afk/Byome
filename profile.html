<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — byome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20" />
</head>
<body>
  <header class="site-header">
    <a href="feed.html" class="logo">by<span class="logo-accent">🌱</span>me</a>
    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <nav id="nav-menu" class="nav-menu" hidden>
      <a href="feed.html" class="btn btn-ghost">Community</a>
      <a href="reviews.html" class="btn btn-ghost">Reviews</a>
      <a href="profile.html" class="btn btn-ghost">Profile</a>
      <a href="biome-shop.html" class="btn btn-ghost">Biome shop</a>
      <a href="suggest-product.html" class="btn btn-ghost">Suggest a product</a>
      <a href="moderate-products.html" id="moderate-link" class="btn btn-ghost" hidden>Moderate</a>
      <hr />
      <span id="header-username" class="header-username"></span>
      <button id="logout-btn" class="btn btn-ghost" type="button">Log out</button>
    </nav>
  </header>
  <main class="feed-page">
    <div class="profile-head">
      <span id="profile-avatar"></span>
      <h1 id="profile-name">Profile</h1>
      <div id="profile-head-actions" class="profile-head-actions"></div>
    </div>
    <div id="profile-traits" class="profile-traits" hidden></div>
    <p id="profile-since" class="feed-empty"></p>
    <p id="profile-stats" class="feed-empty"></p>

    <section id="points-panel" class="points-panel" hidden></section>

    <!-- Filled in by profile.js; stays hidden until the biome tables exist -->
    <section id="biome-section" class="biome-section" hidden>
      <div class="biome-head">
        <h2 class="section-title">Biome</h2>
        <button type="button" id="biome-arrange" class="btn btn-ghost" hidden>Arrange</button>
      </div>
      <div id="biome-shelf"></div>
      <p id="biome-hint" class="biome-hint" hidden></p>
      <div id="biome-editor" class="biome-editor" hidden></div>
    </section>

    <section id="achievements" class="achievements" hidden></section>

    <h2 class="section-title">Reviews</h2>
    <section id="profile-reviews" class="feed"><p class="feed-empty">Loading...</p></section>

    <h2 class="section-title">Posts</h2>
    <section id="profile-posts" class="feed"><p class="feed-empty">Loading...</p></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=20"></script>
  <script src="profile-fields.js?v=20"></script>
  <script src="nav-menu.js?v=20"></script>
  <script src="edit-forms.js?v=20"></script>
  <script src="biome.js?v=20"></script>
  <script src="report.js?v=20"></script>
  <script src="profile.js?v=20"></script>
</body>
</html>
