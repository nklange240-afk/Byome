<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Byome</title>
  <!-- Tab icon and the preview card shown when a link is shared -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-badge-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#24402F" />
  <meta name="description" content="Honest beauty reviews from the people actually using the products, plus a community and a little shelf of plants to grow." />
  <meta property="og:site_name" content="Byome" />
  <meta property="og:title" content="Byome — honest beauty reviews, grown together" />
  <meta property="og:description" content="Honest beauty reviews from the people actually using the products, plus a community and a little shelf of plants to grow." />
  <meta property="og:image" content="https://byome.xyz/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=65" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo"><img src="logo-wordmark.png" alt="Byome home" width="1052" height="261" /></a>
    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <!-- The menu items are filled in by nav-menu.js, the same on every page -->
    <nav id="nav-menu" class="nav-menu" hidden></nav>
  </header>
  <main class="feed-page">
    <div class="profile-head">
      <span id="profile-avatar"></span>
      <h1 id="profile-name">Profile</h1>
      <div id="profile-head-actions" class="profile-head-actions"></div>
    </div>
    <div id="profile-traits" class="profile-traits" hidden></div>
    <p class="profile-meta"><span id="profile-since"></span><span id="profile-stats"></span></p>

    <!-- Your own profile: posts and reviews a moderator removed, kept just
         for you to revise and resubmit (or let go) -->
    <section id="returned" class="returned" hidden></section>

    <!-- Filled in by profile.js; stays hidden until the biome tables exist -->
    <section id="biome-section" class="biome-section" hidden>
      <div class="biome-head">
        <h2 class="section-title">Biome</h2>
        <button type="button" id="biome-arrange" class="btn btn-ghost" hidden>Arrange</button>
      </div>
      <div id="biome-shelf"></div>
      <p id="biome-hint" class="biome-hint" hidden></p>
      <div id="biome-editor" class="biome-editor" hidden></div>
    </section>

    <section id="achievements" class="achievements" hidden></section>

    <section id="points-panel" class="points-panel" hidden></section>

    <h2 class="section-title">Reviews</h2>
    <section id="profile-reviews" class="feed"><p class="feed-empty is-loading">Loading…</p></section>

    <h2 class="section-title">Posts</h2>
    <section id="profile-posts" class="feed"><p class="feed-empty is-loading">Loading…</p></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=65"></script>
  <script src="profile-fields.js?v=65"></script>
  <script src="nav-menu.js?v=65"></script>
  <script src="ui.js?v=65"></script>
  <script src="edit-forms.js?v=65"></script>
  <script src="biome.js?v=65"></script>
  <script src="report.js?v=65"></script>
  <script src="profile.js?v=65"></script>
</body>
</html>
