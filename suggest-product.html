<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suggest a product — byome</title>
  <!-- Tab icon and the preview card shown when a link is shared -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#24402F" />
  <meta name="description" content="Honest beauty reviews from the people actually using the products, plus a community and a little shelf of plants to grow." />
  <meta property="og:site_name" content="byome" />
  <meta property="og:title" content="byome — honest beauty reviews, grown together" />
  <meta property="og:description" content="Honest beauty reviews from the people actually using the products, plus a community and a little shelf of plants to grow." />
  <meta property="og:image" content="https://byome.xyz/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=36" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">by<span class="logo-accent">🌱</span>me</a>

    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <!-- The menu items are filled in by nav-menu.js, the same on every page -->
    <nav id="nav-menu" class="nav-menu" hidden></nav>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <a href="feed.html" class="back-link">← Back</a>
      <h1>Suggest a product</h1>
      <p class="auth-sub">
        Don't see a product listed yet? Add it so reviews have somewhere
        to live. A moderator will look it over before it goes live —
        search first to avoid submitting a duplicate.
      </p>

      <form id="suggest-form" class="stacked-form">
        <label for="product-name">Product name</label>
        <input type="text" id="product-name" required />

        <label for="product-brand">Brand</label>
        <input type="text" id="product-brand" required />

        <!-- Filled in by suggest-product.js when this looks like a product we already have -->
        <div id="similar-products" class="similar-box" aria-live="polite" hidden></div>

        <label for="product-category">Category</label>
        <select id="product-category" required>
          <option value="">Choose a category...</option>
          <option value="Hair Care">Hair Care</option>
          <option value="Body Care">Body Care</option>
          <option value="Makeup">Makeup</option>
          <option value="Skincare">Skincare</option>
          <option value="Fragrance">Fragrance</option>
          <option value="Nail Products">Nail Products</option>
        </select>

        <label for="product-subcategory">Subcategory</label>
        <select id="product-subcategory" required disabled>
          <option value="">Choose a category first</option>
        </select>

        <label for="product-photo">Photo URL (optional)</label>
        <input type="url" id="product-photo" placeholder="https://..." />

        <label for="product-variations">Variations (optional)</label>
        <input type="text" id="product-variations" placeholder="e.g. Vanilla, Mint, Rose — separate with commas" />

        <button type="submit" class="btn btn-solid">Submit for review</button>
      </form>

      <p id="suggest-message" class="auth-message"></p>
      <a id="done-link" href="feed.html" class="btn btn-solid" hidden>Done</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=36"></script>
  <script src="nav-menu.js?v=36"></script>
  <script src="ui.js?v=36"></script>
  <script src="product-match.js?v=36"></script>
  <script src="suggest-product.js?v=36"></script>
</body>
</html>
