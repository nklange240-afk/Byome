<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community — Byome</title>
  <!-- Tab icon and the preview card shown when a link is shared -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-badge-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#24402F" />
  <!-- Saving Byome to a phone's home screen: its own icon, opens full screen -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Byome" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Honest beauty reviews from the people actually using the products, plus a community and a little shelf of plants to grow." />
  <meta property="og:site_name" content="Byome" />
  <meta property="og:title" content="Byome — honest beauty reviews, grown together" />
  <meta property="og:description" content="Honest beauty reviews from the people actually using the products, plus a community and a little shelf of plants to grow." />
  <meta property="og:image" content="https://byome.xyz/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=169" />
  <script src="a11y.js?v=169"></script>
</head>
<body data-biome="forest" data-beta-banner>

  <header class="site-header">
    <a href="index.html" class="logo"><img src="logo-wordmark.png" alt="Byome home" width="1052" height="261" /></a>
    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <!-- The menu items are filled in by nav-menu.js, the same on every page -->
    <nav id="nav-menu" class="nav-menu" hidden></nav>
  </header>

  <main class="feed-page">
    <h1>Community</h1>

    <!-- A slim bar that opens the full post form -->
    <button type="button" id="post-starter" class="composer-starter" aria-controls="post-form" aria-expanded="false">Start a post…</button>
    <form id="post-form" class="composer" hidden>
      <label for="post-title" class="visually-hidden">Post heading</label>
      <input type="text" id="post-title" class="composer-title" maxlength="100" required
        placeholder="Heading" />
      <label for="post-category" class="visually-hidden">Category</label>
      <select id="post-category" required>
        <option value="">Choose a category...</option>
        <option value="SOTD">SOTD</option>
        <option value="Makeup">Makeup</option>
        <option value="Skincare">Skincare</option>
        <option value="Fragrance">Fragrance</option>
        <option value="Body Care">Body Care</option>
        <option value="Nails">Nails</option>
        <option value="Content Creation">Content Creation</option>
        <option value="Pop Culture">Pop Culture</option>
        <option value="Just for Fun">Just for Fun</option>
        <option value="Introductions">Introductions</option>
        <option value="Personal Wins">Personal Wins</option>
        <option value="About Byome">About Byome</option>
      </select>
      <label for="post-body" class="visually-hidden">Write a post</label>
      <textarea id="post-body" maxlength="2000" data-min="10" rows="3"
        placeholder="What's working for you lately? Ask a question or share a product."></textarea>
      <!-- "Add a poll": options and how long it runs (polls.js) -->
      <div id="poll-editor" class="poll-editor" hidden></div>
      <!-- Shown while an event is on (feed.js) -->
      <label id="post-event-row" class="check-row post-event-row" hidden>
        <input type="checkbox" id="post-event" /> <span id="post-event-label">Part of the event</span>
      </label>
      <div class="composer-footer">
        <span class="composer-extras">
          <button type="button" id="poll-toggle" class="action-btn poll-toggle" aria-pressed="false" aria-controls="poll-editor">Add a poll</button>
        </span>
        <span class="composer-buttons">
          <button type="button" id="post-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-solid">Post</button>
        </span>
      </div>
    </form>
    <p id="post-message" class="auth-message" aria-live="polite"></p>

    <!-- Filter buttons are built by feed.js from the category list in the form above -->
    <div id="category-filter" class="category-chips" role="group" aria-label="Filter posts by category"></div>

    <section id="feed" class="feed" aria-live="polite">
      <p class="feed-empty is-loading">Loading posts…</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=169"></script>
  <script src="profile-fields.js?v=169"></script>
  <script src="nav-menu.js?v=169"></script>
  <script src="ui.js?v=169"></script>
  <script src="daily.js?v=169"></script>
  <script src="edit-forms.js?v=169"></script>
  <script src="report.js?v=169"></script>
  <script src="polls.js?v=169"></script>
  <script src="feed.js?v=169"></script>
</body>
</html>
