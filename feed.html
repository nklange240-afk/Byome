<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community — byome</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>

  <header class="site-header">
    <a href="feed.html" class="logo">by<span class="logo-accent">🌱</span>me</a>
    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <nav id="nav-menu" class="nav-menu" hidden>
      <a href="feed.html" class="btn btn-ghost">Community</a>
      <a href="reviews.html" class="btn btn-ghost">Reviews</a>
      <a href="profile.html" class="btn btn-ghost">Profile</a>
      <a href="biome-shop.html" class="btn btn-ghost">Biome shop</a>
      <a href="suggest-product.html" class="btn btn-ghost">Suggest a product</a>
      <a href="moderate-products.html" id="moderate-link" class="btn btn-ghost" hidden>Moderate</a>
      <hr />
      <span id="header-username" class="header-username"></span>
      <button id="logout-btn" class="btn btn-ghost" type="button">Log out</button>
    </nav>
  </header>

  <main class="feed-page">
    <h1>Community</h1>

    <form id="post-form" class="composer">
      <label for="post-title" class="visually-hidden">Post heading</label>
      <input type="text" id="post-title" class="composer-title" maxlength="100" required
        placeholder="Heading" />
      <label for="post-category" class="visually-hidden">Category</label>
      <select id="post-category" required>
        <option value="">Choose a category...</option>
        <option value="SOTD">SOTD</option>
        <option value="Makeup">Makeup</option>
        <option value="Skincare">Skincare</option>
        <option value="Fragrance">Fragrance</option>
        <option value="Body Care">Body Care</option>
        <option value="Nails">Nails</option>
        <option value="Just for Fun">Just for Fun</option>
        <option value="Introductions">Introductions</option>
        <option value="Personal Wins">Personal Wins</option>
      </select>
      <label for="post-body" class="visually-hidden">Write a post</label>
      <textarea id="post-body" maxlength="1000" rows="3"
        placeholder="What's working for you lately? Ask a question or share a product."></textarea>
      <div class="composer-footer">
        <span id="char-count" class="char-count">0 / 1000</span>
        <button type="submit" class="btn btn-solid">Post</button>
      </div>
    </form>
    <p id="post-message" class="auth-message"></p>

    <!-- Filter buttons are built by feed.js from the category list in the form above -->
    <div id="category-filter" class="category-chips" role="group" aria-label="Filter posts by category"></div>

    <section id="feed" class="feed" aria-live="polite">
      <p class="feed-empty">Loading posts...</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=10"></script>
  <script src="nav-menu.js?v=10"></script>
  <script src="report.js?v=10"></script>
  <script src="feed.js?v=10"></script>
</body>
</html>
