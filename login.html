<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Byome</title>
  <!-- Tab icon and the preview card shown when a link is shared -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-badge-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#24402F" />
  <meta name="description" content="Honest beauty reviews from the people actually using the products, plus a community and a little shelf of plants to grow." />
  <meta property="og:site_name" content="Byome" />
  <meta property="og:title" content="Byome — honest beauty reviews, grown together" />
  <meta property="og:description" content="Honest beauty reviews from the people actually using the products, plus a community and a little shelf of plants to grow." />
  <meta property="og:image" content="https://byome.xyz/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=97" />
  <script src="a11y.js?v=97"></script>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo"><img src="logo-wordmark.png" alt="Byome home" width="1052" height="261" /></a>

    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <!-- The menu items are filled in by nav-menu.js, the same on every page -->
    <nav id="nav-menu" class="nav-menu" hidden></nav>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to write reviews and join the conversation.</p>

      <form id="login-form" class="stacked-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />

        <button type="submit" class="btn btn-solid">Log in</button>
      </form>
      <p class="auth-switch"><a href="reset-password.html">Forgot your password?</a></p>

      <p id="login-message" class="auth-message" aria-live="polite"></p>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=97"></script>
  <script src="nav-menu.js?v=97"></script>
  <script src="ui.js?v=97"></script>
  <script src="login.js?v=97"></script>
</body>
</html>
