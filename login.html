<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — byome</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">by<span class="logo-accent">🌱</span>me</a>
    <nav class="header-actions">
      <a href="signup.html" class="btn btn-solid">Sign up</a>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to write reviews and join the conversation.</p>

      <form id="login-form" class="stacked-form">
        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" required />

        <button type="submit" class="btn btn-solid">Log in</button>
      </form>

      <p id="login-message" class="auth-message"></p>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="login.js"></script>
</body>
</html>
