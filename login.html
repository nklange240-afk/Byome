<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — byome</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=17" />
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">by<span class="logo-accent">🌱</span>me</a>

    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <nav id="nav-menu" class="nav-menu" hidden>
      <a href="feed.html" class="btn btn-ghost">Community</a>
      <a href="reviews.html" class="btn btn-ghost">Reviews</a>
      <a href="profile.html" class="btn btn-ghost">Profile</a>
      <a href="biome-shop.html" class="btn btn-ghost">Biome shop</a>
      <a href="suggest-product.html" class="btn btn-ghost">Suggest a product</a>
      <a href="moderate-products.html" id="moderate-link" class="btn btn-ghost" hidden>Moderate</a>
      <hr />
      <span id="header-username" class="header-username"></span>
      <button id="logout-btn" class="btn btn-ghost" type="button" hidden>Log out</button>
      <a href="login.html" id="login-link" class="btn btn-ghost">Log in</a>
      <a href="signup.html" id="signup-link" class="btn btn-solid">Sign up</a>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to write reviews and join the conversation.</p>

      <form id="login-form" class="stacked-form">
        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" required />

        <button type="submit" class="btn btn-solid">Log in</button>
      </form>
      <p class="auth-switch"><a href="reset-password.html">Forgot your password?</a></p>

      <p id="login-message" class="auth-message"></p>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=17"></script>
  <script src="nav-menu.js?v=17"></script>
  <script src="login.js?v=17"></script>
</body>
</html>
