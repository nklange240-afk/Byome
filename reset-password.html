<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password — byome</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=18" />
  <!-- Note what the email link said before Supabase tidies the address bar -->
  <script>window.resetLinkParams = window.location.hash.slice(1) + "&" + window.location.search.slice(1);</script>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">by<span class="logo-accent">🌱</span>me</a>

    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <nav id="nav-menu" class="nav-menu" hidden>
      <a href="feed.html" class="btn btn-ghost">Community</a>
      <a href="reviews.html" class="btn btn-ghost">Reviews</a>
      <a href="profile.html" class="btn btn-ghost">Profile</a>
      <a href="biome-shop.html" class="btn btn-ghost">Biome shop</a>
      <a href="suggest-product.html" class="btn btn-ghost">Suggest a product</a>
      <a href="moderate-products.html" id="moderate-link" class="btn btn-ghost" hidden>Moderate</a>
      <hr />
      <span id="header-username" class="header-username"></span>
      <button id="logout-btn" class="btn btn-ghost" type="button" hidden>Log out</button>
      <a href="login.html" id="login-link" class="btn btn-ghost">Log in</a>
      <a href="signup.html" id="signup-link" class="btn btn-solid">Sign up</a>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <!-- Step 1: ask for the email address -->
      <section id="request-step">
        <h1>Forgot your password?</h1>
        <p class="auth-sub">Enter the email you signed up with and we'll send you a link to choose a new one.</p>
        <form id="request-form" class="stacked-form">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
          <button type="submit" class="btn btn-solid">Send reset link</button>
        </form>
      </section>

      <!-- Step 2: shown after following the link in the email -->
      <section id="new-password-step" hidden>
        <h1>Choose a new password</h1>
        <form id="new-password-form" class="stacked-form">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" required minlength="6" autocomplete="new-password" />
          <label for="confirm-password">Type it again</label>
          <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password" />
          <button type="submit" class="btn btn-solid">Save new password</button>
        </form>
      </section>

      <p id="reset-message" class="auth-message" aria-live="polite"></p>
      <p class="auth-switch">Remembered it? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=18"></script>
  <script src="nav-menu.js?v=18"></script>
  <script src="reset-password.js?v=18"></script>
</body>
</html>
