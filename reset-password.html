<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password — Byome</title>
  <!-- Tab icon and the preview card shown when a link is shared -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-badge-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#24402F" />
  <!-- Saving Byome to a phone's home screen: its own icon, opens full screen -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Byome" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Honest beauty reviews from the people actually using the products, plus a community and a little shelf of plants to grow." />
  <meta property="og:site_name" content="Byome" />
  <meta property="og:title" content="Byome — honest beauty reviews, grown together" />
  <meta property="og:description" content="Honest beauty reviews from the people actually using the products, plus a community and a little shelf of plants to grow." />
  <meta property="og:image" content="https://byome.xyz/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=146" />
  <script src="a11y.js?v=146"></script>
  <!-- Note what the email link said before Supabase tidies the address bar -->
  <script>window.resetLinkParams = window.location.hash.slice(1) + "&" + window.location.search.slice(1);</script>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo"><img src="logo-wordmark.png" alt="Byome home" width="1052" height="261" /></a>

    <button id="menu-toggle" class="hamburger-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <!-- The menu items are filled in by nav-menu.js, the same on every page -->
    <nav id="nav-menu" class="nav-menu" hidden></nav>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <!-- Step 1: ask for the email address -->
      <section id="request-step">
        <h1>Forgot your password?</h1>
        <p class="auth-sub">Enter the email you signed up with and we'll send you a link to choose a new one.</p>
        <form id="request-form" class="stacked-form">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
          <button type="submit" class="btn btn-solid">Send reset link</button>
        </form>
      </section>

      <!-- Step 2: shown after following the link in the email -->
      <section id="new-password-step" hidden>
        <h1>Choose a new password</h1>
        <form id="new-password-form" class="stacked-form">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" required minlength="8" autocomplete="new-password" aria-describedby="new-password-hint" />
          <p class="field-hint" id="new-password-hint">At least 8 characters.</p>
          <label for="confirm-password">Type it again</label>
          <input type="password" id="confirm-password" required minlength="8" autocomplete="new-password" />
          <button type="submit" class="btn btn-solid">Save new password</button>
        </form>
      </section>

      <p id="reset-message" class="auth-message" aria-live="polite"></p>
      <p class="auth-switch">Remembered it? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js?v=146"></script>
  <script src="nav-menu.js?v=146"></script>
  <script src="ui.js?v=146"></script>
  <script src="reset-password.js?v=146"></script>
</body>
</html>
